# ==============================================================================
# Trade Grow — Production NGINX Load Balancer & Reverse Proxy Configuration
# File: /etc/nginx/sites-available/tradegrow
#
# Features:
#   - High-throughput Layer 7 Least-Connection Load Balancing
#   - Dedicated WebSocket upgrade tunnel with 3600s proxy timeout
#   - Tiered Rate Limiting Zones (Auth: 5r/m, Orders: 30r/m, APIs: 120r/m)
#   - Automated Upstream Failover & Passive Health Probes
#   - Strict HSTS, CSP, X-Frame-Options DENY, and Gzip compression
# ==============================================================================

# Rate Limiting Zones (IP-based binary remote address)
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=order_limit:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=api_limit:20m rate=120r/m;
limit_req_zone $binary_remote_addr zone=ws_limit:10m rate=10r/m;

# ── Upstream Server Clusters ──────────────────────────────────────────────────

# Stateless REST Application Cluster
upstream tradegrow_api_cluster {
    least_conn;
    server 127.0.0.1:5000 max_fails=3 fail_timeout=10s;
    # Multi-node expansion nodes (Uncomment for multi-container deployment):
    # server 127.0.0.1:5001 max_fails=3 fail_timeout=10s;
    # server 127.0.0.1:5002 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# Dedicated Real-Time WebSocket Cluster
upstream tradegrow_ws_cluster {
    least_conn;
    server 127.0.0.1:5000 max_fails=2 fail_timeout=5s;
    # server 127.0.0.1:5101 max_fails=2 fail_timeout=5s;
    # server 127.0.0.1:5102 max_fails=2 fail_timeout=5s;
    keepalive 64;
}

# ── HTTP to HTTPS Redirect ───────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN.com www.YOUR_DOMAIN.com;

    # Certbot ACME challenge location
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Main HTTPS Server ────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOUR_DOMAIN.com www.YOUR_DOMAIN.com;

    # SSL Configuration (Managed by Let's Encrypt Certbot)
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:20m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # High-Efficiency Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # ── 1. Real-Time WebSocket Tunneling ──────────────────────────────────────
    location /ws {
        limit_req zone=ws_limit burst=5 nodelay;

        proxy_pass         http://tradegrow_ws_cluster;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Persistent connection timeouts
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering    off;
    }

    # ── 2. Critical Order Placement API (Tiered Rate Limit) ───────────────────
    location ~ ^/api/v1/orders {
        limit_req zone=order_limit burst=10 nodelay;

        proxy_pass         http://tradegrow_api_cluster;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }

    # ── 3. Authentication APIs (Brute-force protection) ───────────────────────
    location ~ ^/api/v1/auth/(login|register) {
        limit_req zone=auth_limit burst=10 nodelay;

        proxy_pass         http://tradegrow_api_cluster;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }

    # ── 4. General REST APIs ─────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api_limit burst=60 nodelay;

        proxy_pass         http://tradegrow_api_cluster;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        client_max_body_size 15m;
    }

    # ── 5. Health Probes (Bypass Rate Limiting for Orchestrators) ─────────────
    location ~ ^/api/v1/health/(live|ready|dependencies) {
        proxy_pass         http://tradegrow_api_cluster;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_read_timeout 5s;
    }

    # ── 6. Frontend SPA & Static Asset Caching ────────────────────────────────
    location / {
        proxy_pass         http://tradegrow_api_cluster;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;

        # Immutable static asset caching
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://tradegrow_api_cluster;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }
}
