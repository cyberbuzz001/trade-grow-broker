version: '3.8'

networks:
  trading-net:
    driver: bridge

volumes:
  pg_data:
  redis_data:

services:
  # ============================================================
  # PostgreSQL — Primary Database
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: stocksharp_postgres
    environment:
      POSTGRES_DB:       stocksharp
      POSTGRES_USER:     stocksharp
      POSTGRES_PASSWORD: stocksharp_pg_pw_2026
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - trading-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stocksharp -d stocksharp"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ============================================================
  # Redis — Cache, Pub/Sub, Rate Limiting
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: stocksharp_redis
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - trading-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ============================================================
  # StockSharp Application Server
  # ============================================================
  brokerage-platform:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stocksharp_brokerage_platform
    ports:
      - "5000:5000"
    environment:
      PORT:                          5000
      NODE_ENV:                      production
      REAL_MONEY_TRADING:            "false"
      # CRITICAL: Set a strong JWT_SECRET before deploying to production
      JWT_SECRET:                    stocksharp_jwt_s3cr3t_2026_virtual_trading_platform_secure_key_minimum_32_chars
      DEFAULT_VIRTUAL_CAPITAL:       "1000000"
      PRIMARY_MARKET_DATA_PROVIDER:  ALPHAVANTAGE
      ALPHAVANTAGE_API_KEY:          CC23XT2DVHARWKAU
      # PostgreSQL
      PG_HOST:                       postgres
      PG_PORT:                       "5432"
      PG_DATABASE:                   stocksharp
      PG_USER:                       stocksharp
      PG_PASSWORD:                   stocksharp_pg_pw_2026
      PG_POOL_MAX:                   "20"
      # Redis
      REDIS_HOST:                    redis
      REDIS_PORT:                    "6379"
      # CORS
      ALLOWED_ORIGINS:               "http://localhost:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - trading-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/v1/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
